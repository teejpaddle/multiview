# Runs the whole page with test patterns. Needs no Resolume, camera or Windows.
# python -m mvbridge --config config/multiview.dev.toml

[server]
port = 8090

[audio.show]
source = "synthetic"
attach_to_feed = "center"

[[feed]]
id = "center"
label = "CENTER SCREEN"
type = "synthetic"
synthetic = { background = [170, 24, 24], motion = "horizontal" }
preview = { width = 1152, height = 536, fps = 30, jpeg_quality = 75 }

[[feed]]
id = "side"
label = "SIDE SCREENS"
type = "synthetic"
synthetic = { background = [24, 48, 170], motion = "vertical" }
preview = { width = 960, height = 540, fps = 30, jpeg_quality = 75 }

[[feed]]
id = "ptz"
label = "PTZ CAMERA"
type = "synthetic"
synthetic = { background = [40, 44, 52], motion = "horizontal", audio_meter = "cam" }
preview = { width = 960, height = 540, fps = 30, jpeg_quality = 75 }
